<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Movement becoming music</title>
  <desc id="d">A hand gesture on the left sends a curved motion path toward a set of sound waves on the right.</desc>
  <!-- background card -->
  <rect x="0" y="0" width="480" height="400" rx="20" fill="#ffffff"/>
  <!-- motion path -->
  <path d="M150 230 C 230 150, 260 320, 340 210" fill="none" stroke="#c2185b" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- hand (simple, abstract) -->
  <g fill="#bfe3f5" stroke="#1c6e9c" stroke-width="5" stroke-linejoin="round">
    <path d="M78 300 v-95 a12 12 0 0 1 24 0 v45 v-80 a12 12 0 0 1 24 0 v70 v-90 a12 12 0 0 1 24 0 v90 v-70 a12 12 0 0 1 24 0 v95 c0 45 -30 70 -60 70 c-30 0 -60 -25 -60 -70 z"/>
    <path d="M78 300 l-28 -40 a12 12 0 0 1 20 -14 l30 40"/>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#1c6e9c" stroke-width="6" stroke-linecap="round">
    <path d="M350 210 q 20 -60 40 0 q 20 60 40 0 q 20 -60 40 0"/>
    <path d="M340 260 q 20 -30 40 0 q 20 30 40 0 q 20 -30 40 0" stroke="#c2185b" opacity="0.85"/>
    <path d="M360 160 q 20 -30 40 0 q 20 30 40 0" stroke="#c2185b" opacity="0.6"/>
  </g>
  <!-- small notes -->
  <g fill="#c2185b">
    <circle cx="300" cy="120" r="9"/><rect x="307" y="82" width="4" height="40" rx="2"/>
    <circle cx="420" cy="320" r="9"/><rect x="427" y="282" width="4" height="40" rx="2"/>
  </g>
</svg>
