---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow"><a href="{{ '/posts/' | relative_url }}">← All posts</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.author %} · {{ page.author }}{% endif %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
